# LUMEN v3 — model tier definitions
# Used by ModelRouter (lumen/core/router.py)
#
# Tiers are NOT bound to any provider: the `primary`/`fallback` model string is
# passed straight to LiteLLM, which routes by prefix. Any tier may name any
# provider directly, and the API key is read from the environment automatically:
#   openrouter/google/gemini-2.5-flash   → OPENROUTER_API_KEY  (default below)
#   anthropic/claude-sonnet-4-5          → ANTHROPIC_API_KEY
#   gemini/gemini-2.5-flash              → GEMINI_API_KEY / GOOGLE_API_KEY
#   openai/gpt-5                         → OPENAI_API_KEY
# To go direct-to-provider, just swap the prefixes below (see PORT_NOTES.md §3).
# Example direct-provider tier:
#   fast:
#     primary: "gemini/gemini-2.5-flash"      # GEMINI_API_KEY
#     fallback: "anthropic/claude-haiku-4-5"  # ANTHROPIC_API_KEY

tiers:
  fast:
    primary: "openrouter/google/gemini-2.5-flash"
    fallback: "openrouter/openai/gpt-4.1-mini"
    max_tokens: 4096
    cost_per_1k_input: 0.00030
    cost_per_1k_output: 0.00250
  smart:
    primary: "openrouter/anthropic/claude-sonnet-4.5"
    fallback: "openrouter/google/gemini-2.5-pro"
    max_tokens: 8192
    cost_per_1k_input: 0.003
    cost_per_1k_output: 0.015
  strategic:
    primary: "openrouter/anthropic/claude-opus-4.1"
    fallback: "openrouter/openai/gpt-5"
    max_tokens: 16384
    cost_per_1k_input: 0.015
    cost_per_1k_output: 0.075
